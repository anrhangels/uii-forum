<section class="workspace-heading section-heading-art"><div><h2>Смена временного пароля</h2><p>Задайте собственный пароль для доступа к рабочему пространству.</p></div><svg class="portal-art" viewBox="0 0 250 140" width="250" height="140" aria-hidden="true" focusable="false"><use href="#art-admin"></use></svg></section>
<!-- IF ERROR --><div class="errorbox">{{ ERROR }}</div><!-- ENDIF -->
<form method="post" class="portal-card"><label class="portal-field">Текущий пароль<input type="password" class="inputbox" name="old_password" autocomplete="current-password" required></label><label class="portal-field">Новый пароль<input type="password" class="inputbox" name="new_password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label class="portal-field">Повторите пароль<input type="password" class="inputbox" name="confirm_password" autocomplete="new-password" required></label>{S_FORM_TOKEN}<button class="button" name="save" value="1">Сменить пароль</button></form>
