<!-- INCLUDE overall_header.html -->
<section class="workspace-heading section-heading-art"><div><h2>Журнал действий</h2><p>Изменения дел и административные операции.</p></div><svg class="portal-art" viewBox="0 0 250 140" width="250" height="140" aria-hidden="true" focusable="false"><use href="#art-journal"></use></svg></section>
<!-- BEGIN activity --><article class="portal-card"><span class="portal-tag">{{ activity.DATE }}</span><h3>{{ activity.ACTOR }} · {{ activity.ACTION }}</h3><!-- IF activity.CASE_URL --><p><a href="{activity.CASE_URL}">Дело №{activity.CASE}</a></p><!-- ELSE --><p class="field-hint">Управление порталом</p><!-- ENDIF --><pre style="white-space:pre-wrap;overflow-wrap:anywhere">{{ activity.DETAILS }}</pre></article><!-- BEGINELSE --><p>Событий пока нет.</p><!-- END activity -->
<!-- IF PREVIOUS_URL or NEXT_URL --><nav aria-label="Страницы"><!-- IF PREVIOUS_URL --><a class="button" href="{PREVIOUS_URL}">Назад</a><!-- ENDIF --><!-- IF NEXT_URL --><a class="button" href="{NEXT_URL}">Следующие события</a><!-- ENDIF --></nav><!-- ENDIF -->
<!-- INCLUDE overall_footer.html -->
