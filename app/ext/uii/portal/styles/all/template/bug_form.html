<!-- INCLUDE overall_header.html -->
<section class="workspace-heading"><div><span class="portal-eyebrow">Поддержка УИИ</span><h2>Сообщить об ошибке</h2><p>Опишите проблему — отчёт увидит только администрация с соответствующим доступом.</p></div></section>
<form class="portal-card bug-form" method="post" action="{{ FORM_ACTION|e }}" data-bug-form>
{% if BUG_ERROR %}<div class="errorbox" role="alert">{{ BUG_ERROR|e }}</div>{% endif %}
<input type="hidden" name="submission_key" value="{{ SUBMISSION_KEY|e }}">
<label class="portal-field" for="bug-title">Название ошибки<input class="inputbox" id="bug-title" name="title" value="{{ BUG_FIELDS.title|e }}" maxlength="150" required placeholder="Не получается закрыть служебный запрос"></label>
<label class="portal-field" for="bug-category">Где обнаружена ошибка?<select id="bug-category" name="category" required><option value="" disabled{% if not BUG_FIELDS.category %} selected{% endif %}>Выберите раздел</option><!-- BEGIN categories --><option value="{{ categories.VALUE|e }}"{% if categories.SELECTED %} selected{% endif %}>{{ categories.LABEL|e }}</option><!-- END categories --></select></label>
<label class="portal-field" for="bug-description">Описание ошибки<textarea class="inputbox" id="bug-description" name="description" rows="6" minlength="20" maxlength="10000" required aria-describedby="bug-description-help">{{ BUG_FIELDS.description|e }}</textarea><small class="field-hint" id="bug-description-help">От 20 до 10 000 символов. Не указывайте пароли и другие секретные данные.</small></label>
<label class="portal-field" for="bug-steps">Как воспроизвести ошибку?<textarea class="inputbox" id="bug-steps" name="reproduction_steps" rows="4" maxlength="5000">{{ BUG_FIELDS.reproduction_steps|e }}</textarea><small class="field-hint">Необязательно. Перечислите действия, после которых появляется проблема.</small></label>
<label class="portal-field" for="bug-expected">Что должно было произойти?<textarea class="inputbox" id="bug-expected" name="expected_behavior" rows="3" maxlength="5000">{{ BUG_FIELDS.expected_behavior|e }}</textarea></label>
<label class="portal-field" for="bug-evidence">Ссылка на скриншот или доказательство<input class="inputbox" type="url" id="bug-evidence" name="evidence_url" value="{{ BUG_FIELDS.evidence_url|e }}" maxlength="2048" aria-describedby="bug-evidence-help"><small class="field-hint" id="bug-evidence-help">При необходимости прикрепите ссылку на скриншот ошибки. Только http:// или https://. Файлы на сервер УИИ не загружаются.</small></label>
{S_FORM_TOKEN}
<button type="submit" class="button button-primary">Отправить отчёт</button><p class="field-hint" data-bug-status role="status" aria-live="polite"></p>
</form>
<script src="{T_THEME_PATH}/bugs.js?v=1.3.0" defer></script>
<!-- INCLUDE overall_footer.html -->
