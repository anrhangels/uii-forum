name: Переходник УИИ · GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'redirect-site/**'
      - '.github/workflows/redirect-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: uii-redirect-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Настроить Pages
        uses: actions/configure-pages@v5
      - name: Подготовить только публичную страницу
        run: |
          mkdir _redirect_public
          cp redirect-site/index.html redirect-site/.nojekyll _redirect_public/
      - name: Загрузить мини-сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: _redirect_public
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
